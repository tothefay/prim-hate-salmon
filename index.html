<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6efff"><meta name="description" content="NekoChat Studio — AI roleplay chat">
<link rel="manifest" href="manifest.webmanifest">
<title>NekoChat Studio</title>
<style>
:root{--bg:#f7f4fb;--panel:#fff;--panel2:#f2edf8;--ink:#30283a;--muted:#877d91;--line:#e9e1ef;--accent:#a982d4;--accent2:#7551a5;--bubble:#f0e8f8;--user:#e7f2fb;--shadow:0 8px 28px #44305c12;--radius:18px;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);height:100dvh;overflow:hidden}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;color:inherit}.app{height:100dvh;display:grid;grid-template-columns:252px minmax(0,1fr);gap:12px;padding:12px;max-width:1600px;margin:auto}
.sidebar,.main,.rightpanel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);min-width:0;min-height:0}.sidebar{display:flex;flex-direction:column;padding:16px 12px;gap:12px}.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 12px}.brandmark{width:38px;height:38px;border-radius:13px;background:linear-gradient(145deg,#d9c2f3,#9d78c7);display:grid;place-items:center;color:white;font-weight:900;font-size:19px}.brand strong{font-size:15px}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.08em}.navlabel{font-size:10px;color:var(--muted);font-weight:800;letter-spacing:.12em;padding:8px 10px 2px}.navbtn,.charrow,.toolbtn{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:transparent;text-align:left;width:100%;font-size:13px}.navbtn:hover,.charrow:hover,.toolbtn:hover{background:var(--panel2)}.navbtn.active{background:var(--bubble);color:var(--accent2);font-weight:700}.ico{width:20px;height:20px;display:inline-grid;place-items:center;flex:none;color:var(--accent2)}.ico svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.charlist{overflow:auto;min-height:50px}.avatar{width:30px;height:30px;border-radius:11px;background:linear-gradient(145deg,#eadcf7,#c8b1e5);display:grid;place-items:center;color:#71538e;font-weight:800;font-size:11px;flex:none;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.charrow span:nth-child(2){overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.tiny{font-size:10px;color:var(--muted)}.sidebottom{margin-top:auto;display:grid;gap:5px}.main{display:flex;flex-direction:column;overflow:hidden}.topbar{height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--line);gap:10px}.top-left{display:flex;align-items:center;gap:10px;min-width:0}.top-title{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.top-sub{font-size:11px;color:var(--muted)}.actions{display:flex;gap:6px}.iconbtn{width:36px;height:36px;border-radius:12px;background:var(--panel2);display:grid;place-items:center}.iconbtn:hover{background:var(--bubble);color:var(--accent2)}.content{flex:1;overflow:auto;min-height:0;padding:18px;scroll-behavior:smooth}.welcome{max-width:680px;margin:8vh auto;text-align:center}.welcome .bigmark{width:74px;height:74px;margin:auto auto 16px;border-radius:25px;background:linear-gradient(145deg,#e6d6f5,#b996dc);display:grid;place-items:center;color:white;font-size:30px;font-weight:900}.welcome h1{font-size:25px;margin:0 0 8px}.welcome p{color:var(--muted);font-size:13px;line-height:1.7}.quickgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:24px;text-align:left}.quick{padding:14px;border:1px solid var(--line);border-radius:15px;background:var(--panel);font-size:12px}.quick b{display:block;margin-bottom:4px}.quick span{color:var(--muted)}.message{max-width:850px;margin:0 auto 18px;display:flex;gap:10px;align-items:flex-start}.message.user{flex-direction:row-reverse}.msgbody{min-width:0;max-width:min(82%,720px)}.msgname{font-size:10px;color:var(--muted);margin:0 4px 5px}.bubble{padding:12px 14px;border-radius:4px 16px 16px 16px;background:var(--bubble);font-size:13px;line-height:1.75;overflow-wrap:anywhere;white-space:pre-wrap}.user .bubble{background:var(--user);border-radius:16px 4px 16px 16px}.msgtools{display:flex;gap:4px;opacity:0;transition:.15s;margin-top:4px}.message:hover .msgtools{opacity:1}.msgtools button{font-size:10px;background:transparent;color:var(--muted);padding:4px 7px;border-radius:7px}.msgtools button:hover{background:var(--panel2)}.composerwrap{padding:12px 16px 14px;border-top:1px solid var(--line);background:var(--panel)}.composer{max-width:900px;margin:auto;border:1px solid var(--line);background:var(--bg);border-radius:17px;padding:9px 10px}.composer textarea{width:100%;resize:none;border:0;outline:0;background:transparent;min-height:48px;max-height:140px;color:var(--ink);font-size:13px;padding:5px}.composebottom{display:flex;justify-content:space-between;align-items:center}.composehint{font-size:10px;color:var(--muted)}.send{background:var(--accent2);color:white;padding:9px 15px;border-radius:11px;font-size:12px;font-weight:700}.send:disabled{opacity:.45}.rightpanel{display:none}.page{max-width:900px;margin:0 auto}.page h2{font-size:20px;margin:4px 0 6px}.pageintro{font-size:12px;color:var(--muted);margin-bottom:20px;line-height:1.6}.section{border:1px solid var(--line);border-radius:16px;padding:15px;margin:12px 0;background:var(--panel)}.section h3{font-size:13px;margin:0 0 12px}.field{display:grid;gap:6px;margin:10px 0}.field label{font-size:11px;font-weight:700;color:var(--muted)}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px;color:var(--ink);outline-color:var(--accent);font-size:12px;min-width:0}.field textarea{min-height:100px;resize:vertical}.rowfields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.primary,.secondary,.danger{padding:10px 13px;border-radius:10px;font-size:12px;font-weight:700}.primary{background:var(--accent2);color:white}.secondary{background:var(--panel2)}.danger{background:#fff0f0;color:#a43f4b}.listitem{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:12px}.listitem:last-child{border:0}.pill{font-size:10px;padding:4px 8px;background:var(--panel2);border-radius:20px;color:var(--muted)}.hidden{display:none!important}.mobilemenu{display:none}.modalback{position:fixed;inset:0;background:#241b2c66;display:grid;place-items:center;padding:15px;z-index:10}.modal{width:min(480px,100%);max-height:85dvh;overflow:auto;background:var(--panel);border-radius:18px;padding:18px;box-shadow:var(--shadow)}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.modalhead b{font-size:15px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#30283a;color:white;padding:10px 15px;border-radius:12px;font-size:12px;z-index:20}.typing{color:var(--muted);font-size:11px;padding:4px 8px}.menuoverlay{display:none}
@media(max-width:760px){.app{display:block;padding:0}.sidebar{position:fixed;z-index:9;inset:0 auto 0 0;width:min(290px,85vw);border-radius:0 20px 20px 0;transform:translateX(-105%);transition:.22s}.sidebar.open{transform:translateX(0)}.menuoverlay.show{display:block;position:fixed;inset:0;background:#1e172866;z-index:8}.main{height:100dvh;border:0;border-radius:0}.topbar{height:58px;padding:0 12px}.mobilemenu{display:grid}.content{padding:14px 11px}.composerwrap{padding:9px 10px max(10px,env(safe-area-inset-bottom))}.quickgrid{grid-template-columns:1fr}.welcome{margin:6vh auto}.welcome h1{font-size:21px}.msgbody{max-width:85%}.message{gap:7px}.msgtools{opacity:1}.rowfields{grid-template-columns:1fr}.top-sub{display:none}}
</style></head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
 <div class="brand"><div class="brandmark">N</div><div><strong>NekoChat Studio</strong><small>ROLEPLAY WORKSPACE</small></div></div>
 <button class="navbtn active" data-page="chat"><span class="ico" data-icon="messages"></span>แชท</button>
 <button class="navbtn" data-page="characters"><span class="ico" data-icon="cat"></span>ตัวละคร</button>
 <button class="navbtn" data-page="lore"><span class="ico" data-icon="book"></span>Lorebook</button>
 <button class="navbtn" data-page="regex"><span class="ico" data-icon="code"></span>Regex</button>
 <div class="navlabel">ห้องสนทนาล่าสุด</div><div id="roomlist" class="charlist"></div>
 <div class="navlabel">ตัวละครของฉัน</div><div id="charlist" class="charlist"></div>
 <div class="sidebottom">
  <button class="navbtn" data-page="prompts"><span class="ico" data-icon="sliders"></span>Prompt & Jailbreak</button>
  <button class="navbtn" data-page="api"><span class="ico" data-icon="key"></span>API & โมเดล</button>
  <button class="navbtn" data-page="settings"><span class="ico" data-icon="settings"></span>ตั้งค่า / ธีม</button>
 </div>
</aside><div class="menuoverlay" id="overlay"></div>
<main class="main">
 <header class="topbar">
  <div class="top-left"><button class="iconbtn mobilemenu" id="hamb"><span class="ico" data-icon="menu"></span></button><div class="avatar" id="topavatar">NC</div><div style="min-width:0"><div class="top-title" id="topTitle">ยินดีต้อนรับ</div><div class="top-sub" id="topSub">พื้นที่สนทนาของคุณ</div></div></div>
  <div class="actions"><button class="iconbtn" id="searchBtn" title="ค้นหา"><span class="ico" data-icon="search"></span></button><button class="iconbtn" id="branchBtn" title="แชทใหม่ / แตกสาย"><span class="ico" data-icon="branch"></span></button><button class="iconbtn" id="moreBtn" title="เมนูเพิ่มเติม"><span class="ico" data-icon="more"></span></button></div>
 </header>
 <section class="content" id="content"></section>
 <div class="composerwrap" id="composerWrap"><div class="composer"><textarea id="prompt" placeholder="พิมพ์ข้อความของคุณ... (Enter เพื่อส่ง · Shift+Enter ขึ้นบรรทัดใหม่)"></textarea><div class="composebottom"><span class="composehint" id="modelHint">ยังไม่ได้เลือก API · ตั้งค่าได้ที่ API & โมเดล</span><button class="send" id="sendBtn">ส่งข้อความ ↗</button></div></div></div>
</main></div><div id="modalroot"></div><div id="toastroot"></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const icons={
messages:'<rect x="3" y="4" width="18" height="15" rx="4"/><path d="m8 19-3 2v-5M8 9h8M8 13h5"/>',
cat:'<path d="M4 10 5 4l5 3h4l5-3 1 6v5a8 8 0 0 1-16 0z"/><path d="M9 13h.01M15 13h.01M9 17q3 2 6 0"/>',
book:'<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v17H6.5A2.5 2.5 0 0 1 4 17.5z"/><path d="M4 5v13M8 7h8M8 11h7"/>',
code:'<path d="m8 8-4 4 4 4M16 8l4 4-4 4M14 5l-4 14"/>',
sliders:'<path d="M4 6h16M4 12h16M4 18h16"/><circle cx="8" cy="6" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="10" cy="18" r="2"/>',
key:'<circle cx="8" cy="15" r="4"/><path d="m11 12 9-9M16 7l2 2M14 9l2 2"/>',
settings:'<circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1 1.4 1.1-1.4 2.4-1.7-.6a8 8 0 0 1-1.7 1l-.3 1.8h-2.8l-.3-1.8a8 8 0 0 1-1.7-1l-1.7.6-1.4-2.4 1.4-1.1a7 7 0 0 1 0-2l-1.4-1.1 1.4-2.4 1.7.6a8 8 0 0 1 1.7-1l.3-1.8h2.8l.3 1.8a8 8 0 0 1 1.7 1l1.7-.6 1.4 2.4-1.4 1.1a7 7 0 0 1 0 2z"/>',
menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>',
branch:'<path d="M6 3v12a4 4 0 0 0 4 4h8"/><path d="m14 15 4 4-4 4M6 3a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/>',
more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',
plus:'<path d="M12 5v14M5 12h14"/>',trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 14h10l1-14M9 7V4h6v3"/>',
pin:'<path d="m16 3 5 5-4 1-4 4-1 5-2-2-5 5-1-1 5-5-2-2 5-1 4-4z"/>',
copy:'<rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h3"/>',
edit:'<path d="m4 16-.8 4.8L8 20l11-11-4-4zM13.5 6.5l4 4"/>'
};
$$('[data-icon]').forEach(e=>e.innerHTML='<svg viewBox="0 0 24 24">'+(icons[e.dataset.icon]||'')+'</svg>');
const DB='nekachat-studio', STORE='state'; let state={chars:[],rooms:[],apis:[],activeChar:null,activeRoom:null,settings:{theme:'lavender',css:'',userName:'ผู้ใช้',userAvatar:'',model:'',think:0},prompts:[],lore:[],regex:[]};
function openDB(){return new Promise((res,rej)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function save(){try{let db=await openDB();db.transaction(STORE,'readwrite').objectStore(STORE).put(state,'app');}catch(e){toast('บันทึกข้อมูลไม่สำเร็จ')}}
async function load(){try{let db=await openDB();let v=await new Promise((res,rej)=>{let r=db.transaction(STORE).objectStore(STORE).get('app');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});if(v)state=v}catch(e){}}
function toast(s){let n=document.createElement('div');n.className='toast';n.textContent=s;$('#toastroot').append(n);setTimeout(()=>n.remove(),2400)}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function activeChar(){return state.chars.find(c=>c.id===state.activeChar)}
function activeRoom(){return state.rooms.find(r=>r.id===state.activeRoom)}
function newId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function avatar(c){return c?.image?`<img src="${c.image}">`:esc((c?.name||'N').slice(0,1))}
function renderLists(){
 $('#charlist').innerHTML=state.chars.map(c=>`<button class="charrow" data-char="${c.id}"><span class="avatar">${avatar(c)}</span><span>${esc(c.name)}</span>${c.favorite?'<span class="tiny">★</span>':''}</button>`).join('')||'<div class="tiny" style="padding:8px 10px">ยังไม่มีตัวละคร</div>';
 $('#roomlist').innerHTML=state.rooms.slice().reverse().slice(0,12).map(r=>`<button class="charrow" data-room="${r.id}"><span class="ico"><svg viewBox="0 0 24 24">${icons.messages}</svg></span><span>${esc(r.title||'ห้องสนทนา')}</span></button>`).join('')||'<div class="tiny" style="padding:8px 10px">ยังไม่มีห้องแชท</div>';
 $$('[data-char]').forEach(b=>b.onclick=()=>{state.activeChar=b.dataset.char;let room=state.rooms.find(r=>r.charId===state.activeChar);if(!room)createRoom();else state.activeRoom=room.id;save();showPage('chat')});
 $$('[data-room]').forEach(b=>b.onclick=()=>{state.activeRoom=b.dataset.room;state.activeChar=activeRoom()?.charId;save();showPage('chat')});
}
function setHeader(title,sub=''){ $('#topTitle').textContent=title;$('#topSub').textContent=sub;let c=activeChar();$('#topavatar').innerHTML=c?avatar(c):'NC';}
function showPage(p){$$('.navbtn[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('#sidebar').classList.remove('open');$('#overlay').classList.remove('show');$('#composerWrap').classList.toggle('hidden',p!=='chat');if(p==='chat')renderChat();else if(p==='characters')renderCharacters();else if(p==='api')renderAPI();else if(p==='settings')renderSettings();else if(p==='prompts')renderPrompts();else if(p==='lore')renderLore();else if(p==='regex')renderRegex();}
function createRoom(parent=null){let c=activeChar();if(!c){toast('เลือกหรือสร้างตัวละครก่อน');return}let r={id:newId(),charId:c.id,title:'แชทใหม่',messages:[],parent};state.rooms.push(r);state.activeRoom=r.id;save();renderLists();renderChat()}
function renderChat(){
 let c=activeChar(),r=activeRoom();setHeader(c?.name||'ยินดีต้อนรับ',c?'กำลังคุยกับตัวละคร':'พื้นที่สนทนาของคุณ');$('#modelHint').textContent=state.settings.model||'เลือกโมเดลใน API & โมเดล';
 if(!c||!r){$('#content').innerHTML=`<div class="welcome"><div class="bigmark">N</div><h1>พื้นที่เรื่องราวของคุณ</h1><p>สร้างตัวละครของคุณ แล้วเริ่มบทสนทนาในโลกที่จินตนาการได้ไม่รู้จบ</p><div class="quickgrid"><div class="quick"><b>สร้างตัวละคร</b><span>กำหนดบุคลิก เรื่องราว และภาพประจำตัว</span></div><div class="quick"><b>เชื่อมต่อ AI</b><span>เพิ่ม Google AI Studio API Key ของคุณ</span></div></div><button class="primary" style="margin-top:20px" onclick="showPage('characters')">เริ่มสร้างตัวละคร</button></div>`;return}
 if(r.messages.length===0){$('#content').innerHTML=`<div class="welcome"><div class="bigmark">${avatar(c)}</div><h1>${esc(c.name)}</h1><p>${esc(c.description||'พร้อมเริ่มต้นเรื่องราวใหม่แล้ว')}</p><button class="secondary" onclick="document.querySelector('#prompt').focus()">เริ่มบทสนทนา</button></div>`}
 else $('#content').innerHTML=r.messages.map((m,i)=>`<article class="message ${m.role==='user'?'user':''}" data-mid="${m.id}"><div class="avatar">${m.role==='user'?(state.settings.userAvatar?`<img src="${state.settings.userAvatar}">`:esc((state.settings.userName||'U')[0])):avatar(c)}</div><div class="msgbody"><div class="msgname">${m.role==='user'?esc(state.settings.userName||'ผู้ใช้'):esc(c.name)} ${m.pinned?' · ปักหมุด':''}</div><div class="bubble">${esc(m.text)}</div><div class="msgtools"><button onclick="editMessage('${m.id}')">แก้ไข</button><button onclick="copyMessage('${m.id}')">คัดลอก</button><button onclick="pinMessage('${m.id}')">${m.pinned?'เลิกปักหมุด':'ปักหมุด'}</button><button onclick="branchFrom('${m.id}')">แตกสาย</button><button onclick="deleteMessage('${m.id}')">ลบ</button></div></div></article>`).join('');
 $('#content').scrollTop=$('#content').scrollHeight;
}
function renderCharacters(){setHeader('ตัวละคร','จัดการตัวละครและการ์ดของคุณ');$('#content').innerHTML=`<div class="page"><h2>ตัวละครของฉัน</h2><p class="pageintro">สร้างตัวละครได้ไม่จำกัดความยาวคำอธิบาย พร้อมแท็ก โฟลเดอร์ และรูปภาพ</p><button class="primary" id="addChar">＋ สร้างตัวละคร</button> <button class="secondary" id="importChar">นำเข้า PNG / JSON</button><input id="charFile" type="file" accept=".json,.png,application/json,image/png" hidden><div class="section" id="chars">${state.chars.map(c=>`<div class="listitem"><div style="display:flex;gap:10px;align-items:center;min-width:0"><div class="avatar">${avatar(c)}</div><div><b>${esc(c.name)}</b><div class="tiny">${esc(c.folder||'ไม่มีโฟลเดอร์')} · ${esc((c.tags||[]).join(', '))}</div></div></div><div style="display:flex;gap:5px"><button class="secondary" onclick="toggleFav('${c.id}')">${c.favorite?'★':'☆'}</button><button class="secondary" onclick="editChar('${c.id}')">แก้ไข</button><button class="secondary" onclick="duplicateChar('${c.id}')">สำเนา</button><button class="danger" onclick="removeChar('${c.id}')">ลบ</button></div></div>`).join('')||'<p class="tiny">ยังไม่มีตัวละคร ลองสร้างตัวแรกของคุณ</p>'}</div></div>`;
 $('#addChar').onclick=()=>charModal();$('#importChar').onclick=()=>$('#charFile').click();$('#charFile').onchange=importCharacter;
}

$('#searchBtn').onclick=()=>{modal(`<b>ค้นหาในแชทปัจจุบัน</b><div class="field"><input id="searchq" placeholder="พิมพ์คำที่ต้องการค้นหา"></div><div id="searchres"></div>`);$('#searchq').oninput=()=>{let q=$('#searchq').value.toLowerCase();let ms=activeRoom()?.messages||[];$('#searchres').innerHTML=ms.filter(m=>m.text.toLowerCase().includes(q)&&q).map(m=>`<div class="listitem">${esc(m.text.slice(0,150))}</div>`).join('')||'<p class="tiny">ไม่พบข้อความ</p>'}};
$('#branchBtn').onclick=()=>{if(activeRoom())createRoom(activeRoom().id);else toast('เลือกตัวละครก่อน')};
$('#moreBtn').onclick=()=>modal(`<b>เมนูแชท</b><button class="toolbtn" onclick="retryLast()">↻ สร้างคำตอบใหม่</button><button class="toolbtn" onclick="newChat()">＋ แชทใหม่</button><button class="toolbtn" onclick="showHistory()">ประวัติ / Branch</button><button class="toolbtn" onclick="selectMessages()">เลือกหลายข้อความ</button><button class="toolbtn" onclick="exportRoom()">ส่งออกแชท JSON</button>`);
function newChat(){closeModal();createRoom()}
function retryLast(){closeModal();let r=activeRoom();if(!r)return;let last=r.messages.at(-1);if(last?.role==='assistant')r.messages.pop();let u=r.messages.at(-1);if(u?.role==='user'){let text=u.text;r.messages.pop();save();$('#prompt').value=text;sendMessage()}}
function showHistory(){closeModal();modal(`<b>ประวัติห้องสนทนา / Branch</b>${state.rooms.filter(r=>r.charId===state.activeChar).map(r=>`<div class="listitem"><span>${esc(r.title)} ${r.parent?'· branch':''}</span><button class="secondary" onclick="switchRoom('${r.id}')">เปิด</button></div>`).join('')||'<p class="tiny">ไม่มีห้องแชท</p>'}`)}
function switchRoom(id){state.activeRoom=id;save();closeModal();renderLists();renderChat()}
function selectMessages(){closeModal();let r=activeRoom();modal(`<b>เลือกหลายข้อความ</b><div id="multiselect">${r.messages.map(m=>`<label class="listitem"><span><input type="checkbox" value="${m.id}"> ${esc(m.text.slice(0,100))}</span></label>`).join('')}</div><button class="secondary" id="copyselected">คัดลอกที่เลือก</button> <button class="danger" id="deleteselected">ลบที่เลือก</button>`);$('#copyselected').onclick=()=>{let ids=$$('#multiselect input:checked').map(x=>x.value);navigator.clipboard?.writeText(r.messages.filter(m=>ids.includes(m.id)).map(m=>m.text).join('\\n\\n'));toast('คัดลอกแล้ว')};$('#deleteselected').onclick=()=>{let ids=$$('#multiselect input:checked').map(x=>x.value);r.messages=r.messages.filter(m=>!ids.includes(m.id));save();closeModal();renderChat()}}
function exportRoom(){let r=activeRoom();download(JSON.stringify(r,null,2),'nekachat-chat.json','application/json');closeModal()}
async function init(){await load();applyTheme();renderLists();if(state.activeRoom&&!state.rooms.some(r=>r.id===state.activeRoom))state.activeRoom=null;if(state.activeChar&&!state.chars.some(c=>c.id===state.activeChar))state.activeChar=null;if(state.activeChar&&!state.activeRoom){let r=state.rooms.find(x=>x.charId===state.activeChar);if(r)state.activeRoom=r.id}showPage('chat');}
init();
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
